# Dedicated log channel so this plugin's output is separable from Shopware's.
# ConfigurableLogger decorates monolog.logger.kommandhub_shipping_channel (see services.yml)
# and gates what actually reaches this handler on the plugin's debug settings.
monolog:
  channels: ['kommandhub_shipping_channel']

  handlers:
    shippingLogHandler:
      max_files: 7
      type: rotating_file
      path: "%kernel.logs_dir%/kommandhub_shipping_%kernel.environment%.log"
      channels: ["kommandhub_shipping_channel"]
